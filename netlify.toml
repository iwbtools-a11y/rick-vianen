[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/blog"
  to = "/content"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/content/:splat"
  status = 301
  force = true

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
